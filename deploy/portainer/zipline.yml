# use this for deploying zipline seperately, need any help? contact @SpiralTechDivision on telegram :)
services:
  postgresql:
    image: ${POSTGRES_IMAGE:-postgres:18.6-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_USER: zipline
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD:?Set POSTGRESQL_PASSWORD}
      POSTGRES_DB: zipline
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "zipline"]
      interval: 10s
      timeout: 5s
      retries: 5
  zipline:
    image: ${ZIPLINE_IMAGE:?Set ZIPLINE_IMAGE to a fixed Zipline release or digest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://zipline:${POSTGRESQL_PASSWORD}@postgresql:5432/zipline
      CORE_SECRET: ${CORE_SECRET:?Set CORE_SECRET}
      CORE_HOSTNAME: 0.0.0.0
      CORE_PORT: "3000"
      CORE_TRUST_PROXY: "true"
      CORE_RETURN_HTTPS_URLS: "true"
      CORE_DEFAULT_DOMAIN: ${ZIPLINE_DOMAIN:?Set ZIPLINE_DOMAIN}
      INVITES_ENABLED: "false"
    ports:
      - "127.0.0.1:8191:3000"
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - uploads:/zipline/uploads
      - public:/zipline/public
      - themes:/zipline/themes
volumes:
  database:
  uploads:
  public:
  themes:
