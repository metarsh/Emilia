[project]
name = "emilia"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "UP"]
ignore = ["B008", "B904"]

[tool.ruff.lint.per-file-ignores]
"Emilia/__init__.py" = ["F401"]
